name: Build and Test

# No paths-ignore for Markdown: test_dictionary.py and test_phrasebook.py run the examples in docs/.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set short SHA
        shell: bash
        run: echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      # ALSA for scsynth's PortAudio and the dev host's rtaudio; X11 and OpenGL for the CLAP editor
      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libgl1-mesa-dev

      # Compiler output, not build/: CMakeLists.txt uses ccache when present, and a restored build
      # tree would keep stale CMake state and SC's patched source.
      - name: Cache compilation
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: ${{ matrix.name }}
          max-size: 1G

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -Wno-dev

      - name: Build
        run: cmake --build build --config Release --parallel

      # A clang build of stac beside the gcc one, for test_compilers.py
      - name: Build stac with clang
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build-clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -Wno-dev
          cmake --build build-clang --target stac --parallel

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

      # Tests that need an audio device skip themselves
      - name: Run pytest
        run: uv run pytest -q
        env:
          STAC_OTHER: ${{ runner.os == 'Linux' && format('{0}/build-clang/stac', github.workspace) || '' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stac-${{ matrix.name }}-${{ env.SHORT_SHA }}
          path: |
            build/stac
            build/plugins/
            build/examples/clap/stac.clap
            build/examples/clap/stac/
          retention-days: 14

  # The suites under ASan with UBSan, and under TSan. A report fails a test through the exit code:
  # ASan aborts, TSan exits 66. Suppressions are in tests/sanitizers/.
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
            flags: -fsanitize=address,undefined
          - name: tsan
            flags: -fsanitize=thread
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      # halt_on_error over -fno-sanitize-recover: suppressions apply only to recoverable checks
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/tests/sanitizers/ubsan.supp
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/sanitizers/tsan.supp
    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libgl1-mesa-dev

      # Ubuntu's default 32 bits of mmap randomization break the TSan and ASan runtimes at startup
      - name: Lower mmap randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Cache compilation
        uses: hendrikmuhs/ccache-action@v1.2.25
        with:
          key: sanitize-${{ matrix.name }}
          max-size: 1G

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Configure CMake
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -Wno-dev
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_C_FLAGS=${{ matrix.flags }} -O1 -g -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }} -O1 -g -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"
          "-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.flags }}"
          "-DCMAKE_MODULE_LINKER_FLAGS=${{ matrix.flags }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure

      - name: Run pytest
        run: uv run pytest -q -m "not timing"
